<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de Tabla</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Tabla de Estudiantes</h2>

    <table>
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Curso</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>20</td>
            <td>Matemáticas</td>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>22</td>
            <td>Programación</td>
        </tr>
        <tr>
            <td>Laura</td>
            <td>19</td>
            <td>Diseño</td>
        </tr>
    </table>

</body>
</html>
